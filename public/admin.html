<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — DNight Store</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ff;--ink:#10223d;--muted:#5a6b8c;--card:rgba(255,255,255,.62);--line:rgba(16,34,61,.14);--acc:#1b6cff;--accink:#fff;--ok:#0f8a5f;--bad:#c0392b;--field:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1020;--ink:#eef4ff;--muted:#9fb2d6;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--acc:#6cb0ff;--accink:#06142b;--ok:#4fd1a1;--bad:#ff8b7b;--field:rgba(255,255,255,.1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
 background:radial-gradient(circle at 12% 0,#5ec8ff66,transparent 45%),radial-gradient(circle at 92% 18%,#b58bff55,transparent 40%),radial-gradient(circle at 50% 100%,#ff9ec744,transparent 45%),var(--bg);
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.w{max-width:1100px;margin:0 auto;padding:18px}
.box{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
nav b{font-size:1.3rem;letter-spacing:-.03em;margin-right:10px}
nav .sp{margin-left:auto}
button,.btn{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
button:hover,.btn:hover{transform:scale(1.04)}button:active{transform:scale(.94)}
button[aria-pressed="true"],.pri{background:var(--acc);color:var(--accink);border-color:transparent}
.dan{color:var(--bad)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2{margin:0 0 12px;font-size:1.15rem}
form.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
label{display:grid;gap:5px;font-size:.85rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--field);width:100%}
input[type=color]{padding:2px;height:40px}input[type=checkbox]{width:auto}
.wide{grid-column:1/-1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;margin-right:6px}
.low{color:var(--bad);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat b{display:block;font-size:1.5rem;margin-top:4px}
.note{color:var(--muted);font-size:.88rem;line-height:1.5;margin:0}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pc{width:104px;border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;gap:6px;background:var(--field);text-align:center;font-size:.75rem}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.pc button{padding:4px 6px;font-size:.75rem}
.pc .cv{color:var(--ok);font-weight:700}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.prow input[type=url]{flex:1 1 220px;width:auto}
.tn{width:34px;height:34px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,160%);transition:transform .5s cubic-bezier(.3,1.6,.5,1);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:9}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== DNight: tema neon azul ===== */
:root:root:root{--bg:#04060e;--ink:#eaf0ff;--muted:#8d9bc0;--card:rgba(120,160,255,.07);--line:rgba(90,130,255,.26);--acc:#2f5bff;--accink:#fff;--ok:#43d9a0;--bad:#ff8b7b;--field:rgba(120,160,255,.09)}
body{background:radial-gradient(120% 60% at 50% -10%,#0d1b5e 0%,transparent 60%),var(--bg)}
nav b{font-size:1.2rem}
.lg{width:36px;height:36px;border-radius:11px;object-fit:cover;box-shadow:0 0 16px rgba(60,120,255,.55)}
.pri{box-shadow:0 0 22px rgba(47,91,255,.5)}
select option{background:#0b1226;color:#eaf0ff}
.stat b{color:#6f93ff}
</style>
</head>
<body>
<div class="w">
<nav class="box" style="padding:12px 16px">
  <img class="lg" src="logo.png" alt=""><b>DNight Admin</b>
  <button data-tab="produtos">Produtos</button><button data-tab="chaves">Chaves</button><button data-tab="pedidos">Pedidos</button><button data-tab="clientes">Clientes</button><button data-tab="compras">Compras</button>
  <button data-tab="vendas">Vendas</button><button data-tab="resumo">Resumo</button>
  <a class="btn sp" href="/" target="_blank">Ver loja</a>
</nav>
<div id="view"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="imp" accept="application/json" hidden>
<input type="file" id="pimg" accept="image/*" multiple hidden>
<input type="file" id="pfile" hidden>

<script>
const SEED=[["Grand Theft Auto V", "Mundo aberto em Los Santos, com campanha, online e muito caos.", 79.9, "Ação", "🚗", "#ffd36b", "#d9481c"],["Spider-Man 2", "Balance por Nova York como Peter Parker e Miles Morales.", 249.9, "Ação", "🕷️", "#ff6a6a", "#7d0b1a"],["Red Dead Redemption 2", "Faroeste épico de mundo aberto com a gangue de Dutch.", 149.9, "Aventura", "🤠", "#ff9a5a", "#9c1313"],["Forza Horizon 6", "Corridas em mundo aberto com carros de tirar o fôlego.", 299.9, "Corrida", "🏎️", "#8fd3ff", "#1d5fd1"],["The Last of Us Part I", "Sobrevivência e emoção numa jornada inesquecível.", 199.9, "Aventura", "🌿", "#9bd18a", "#244d33"],["God of War Ragnarök", "Kratos e Atreus enfrentam o fim do mundo nórdico.", 229.9, "Ação", "⚔️", "#9ec9ff", "#22397a"],["Elden Ring", "RPG de ação em um mundo aberto sombrio e desafiador.", 169.9, "RPG", "🗡️", "#ffe08a", "#6f4f0f"],["Cyberpunk 2077", "RPG futurista em Night City, cheio de escolhas.", 129.9, "RPG", "🤖", "#fff36b", "#b8105f"],["Hogwarts Legacy", "Viva a magia como aluno de Hogwarts no século XIX.", 159.9, "RPG", "🪄", "#cdb8ff", "#432a8f"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dt=s=>new Date(s).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
const nextId=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
function seed(){return{products:SEED.map((x,i)=>({id:i+1,n:x[0],d:x[1],p:x[2],cost:Math.round(x[2]*50)/100,k:demoKeys(),s:3,c:x[3],e:x[4],c1:x[5],c2:x[6],a:true})),purchases:[],sales:[]}}
function norm(d){d.orders=d.orders||[];d.sales=d.sales||[];d.purchases=d.purchases||[];d.cfg=d.cfg||{mode:"pix",pix:""};d.seq=d.seq||0;
  d.products.forEach(p=>{p.k=Array.isArray(p.k)?p.k:[];p.s=(p.s===undefined||p.s===null||p.s==="")?p.k.length:Math.max(0,parseInt(p.s)||0)});return d}
const rnd=(n=4)=>Array.from({length:n},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");
const demoKeys=()=>[1,2,3].map(()=>"DEMO-"+rnd()+"-"+rnd()+"-"+rnd());
/* ---- dados no servidor ---- */
let DB=norm({products:[]}),REV=0,IPOK=false,BLOB=false,tab="produtos",editId=0,tt,draft=[],dfile=null;
const pass=()=>sessionStorage.getItem("dn_admin")||"";
async function api(url,opt={}){
  const r=await fetch(url,{cache:"no-store",...opt,headers:{"X-Admin":pass(),...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){sessionStorage.removeItem("dn_admin");login("Senha incorreta.");throw Object.assign(new Error("Faça login de novo."),{status:401})}
  if(!r.ok)throw Object.assign(new Error(j.error||"Erro "+r.status),{status:r.status});return j;
}
async function load(){const j=await api("/api/admin/db");DB=norm(j.db);REV=j.rev;IPOK=j.ip;BLOB=!!j.blob}
/* aplica uma alteração sobre os dados mais recentes do servidor (não apaga pedidos que chegaram enquanto você editava) */
async function commit(fn){
  for(let t=0;t<3;t++){
    await load();const out=fn();
    try{const j=await api("/api/admin/db",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({rev:REV,db:Object.assign({},DB,{orders:undefined})})});REV=j.rev;return out}
    catch(e){if(e.status!==409)throw e}
  }
  throw new Error("Os dados mudaram várias vezes. Tente de novo.");
}
function login(msg){
  $("#view").innerHTML=`<div class="box" style="max-width:380px;margin:40px auto"><h2>Entrar no admin</h2>${msg?`<p class="note" style="color:var(--bad);margin-bottom:10px">${esc(msg)}</p>`:""}
  <form class="g" data-form="login" style="grid-template-columns:1fr"><label>Senha<input type="password" name="pw" autocomplete="current-password" required autofocus></label><button class="pri">Entrar</button></form></div>`;
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)}
const pname=id=>(DB.products.find(p=>p.id===id)||{n:"(removido)"}).n;
async function start(){if(!pass())return login();try{await load();render()}catch(e){if(e.status!==401)$("#view").innerHTML=`<div class="box">Não foi possível falar com o servidor: ${esc(e.message)}</div>`}}
const opts=()=>'<option value="">Escolha…</option>'+DB.products.map(p=>`<option value="${p.id}" data-price="${p.p}" data-cost="${p.cost}">${esc(p.n)} (estoque ${p.s})</option>`).join("");

const phHTML=()=>draft.length?draft.map((u,i)=>`<div class="pc"><img src="${esc(u)}" alt="Foto ${i+1}">${i===0?'<span class="cv">Capa</span>':`<button type="button" data-pcover="${i}">Tornar capa</button>`}<button type="button" class="dan" data-prem="${i}">Remover</button></div>`).join(""):'<span class="note">Nenhuma foto ainda.</span>';
const drawPh=()=>{const el=$("#ph");if(el)el.innerHTML=phHTML()};
function compress(file,max=800,q=.72){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};img.src=u})}
const mb=n=>n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB";
const fileInfo=()=>dfile?`<b>📦 ${esc(dfile.fn)}</b> <span class="note">(${mb(dfile.fz||0)})</span>`:'<span class="note">Nenhum arquivo enviado.</span>';
function vProd(){
  const e=DB.products.find(p=>p.id===editId)||{n:"",d:"",p:"",cost:"",s:0,u:"",c:"Geral",e:"🛍️",c1:"#9be7ff",c2:"#2f7bff",a:true};
  return `<div class="box"><h2>${editId?"Editar produto":"Novo produto"}</h2>
  <form class="g" data-form="prod">
    <label>Nome<input name="n" value="${esc(e.n)}" required></label>
    <label>Categoria<input name="c" value="${esc(e.c)}"></label>
    <label>Preço de venda (R$)<input type="number" step="0.01" min="0" name="p" value="${esc(e.p)}" required></label>
    <label>Custo (R$)<input type="number" step="0.01" min="0" name="cost" value="${esc(e.cost)}"></label>
    <label>Estoque<input type="number" min="0" name="s" value="${esc(e.s)}"></label>
    <div class="wide"><div class="note" style="margin-bottom:8px">Arquivo do jogo (entregue ao comprador com o botão Download). Enviar o arquivo aqui garante o download direto.</div>
      <div class="prow"><span id="fileinfo">${fileInfo()}</span><button type="button" data-addfile>Enviar arquivo</button>${dfile?'<button type="button" class="dan" data-rmfile>Remover arquivo</button>':""}</div></div>
    <label class="wide">Ou link do arquivo (usado só se não houver arquivo enviado)<input type="url" name="u" value="${esc(e.u||"")}" placeholder="https://… (Google Drive, Dropbox ou link direto do arquivo)"></label>
    <label>Cor 1<input type="color" name="c1" value="${esc(e.c1)}"></label>
    <label>Cor 2<input type="color" name="c2" value="${esc(e.c2)}"></label>
    <label class="wide">Descrição curta (aparece no card)<input name="d" value="${esc(e.d)}" maxlength="120"></label>
    <label class="wide">Descrição completa (aparece ao abrir o produto)<textarea name="dl" rows="5">${esc(e.dl||"")}</textarea></label>
    <div class="wide"><div class="note" style="margin-bottom:8px">Fotos do produto (até 6). A primeira é a capa. Sem foto, a loja usa o ícone do SA-MP.</div>
      <div class="ph" id="ph">${phHTML()}</div>
      <div class="prow"><button type="button" data-addphoto>Enviar fotos</button><input type="url" id="purl" placeholder="ou cole o link de uma imagem (https://…)"><button type="button" data-addurl>Adicionar link</button></div></div>
    <label><span><input type="checkbox" name="a" ${e.a?"checked":""}> Visível na loja</span></label>
    <div><button class="pri">Salvar produto</button> ${editId?'<button type="button" data-cancel>Cancelar</button>':""}</div>
  </form></div>
  <div class="box tw"><h2>Produtos</h2><table><tr><th></th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Custo</th><th>Estoque</th><th>Loja</th><th></th></tr>
  ${DB.products.slice().reverse().map(p=>`<tr><td>${(p.f&&p.f[0])?`<img class="tn" src="${esc(p.f[0])}" alt="">`:`<img class="tn" src="samp.png" alt="">`}</td><td>${esc(p.n)}</td><td>${esc(p.c)}</td><td>${brl(p.p)}</td><td>${brl(p.cost)}</td>
   <td class="${p.s<=3?"low":""}">${p.s}</td><td>${p.a?"Visível":"Oculto"}</td>
   <td><button data-edit="${p.id}">Editar</button> <button class="dan" data-del="${p.id}">Excluir</button></td></tr>`).join("")||'<tr><td colspan="8">Nenhum produto cadastrado.</td></tr>'}
  </table></div>`;
}
function vBuy(){
  return `<div class="box"><h2>Registrar compra (entrada de estoque)</h2>
  <form class="g" data-form="buy"><label>Produto<select name="pid" id="pp" required>${opts()}</select></label>
  <label>Quantidade<input type="number" min="1" name="q" value="1" required></label>
  <label>Custo unitário (R$)<input type="number" step="0.01" min="0" name="v" id="pc" required></label>
  <label>Fornecedor<input name="who"></label><div><button class="pri">Registrar compra</button></div></form></div>
  <div class="box tw"><h2>Últimas compras</h2><table><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Custo un.</th><th>Total</th><th>Fornecedor</th></tr>
  ${DB.purchases.slice().reverse().slice(0,100).map(r=>`<tr><td>${dt(r.at)}</td><td>${esc(pname(r.pid))}</td><td>${r.q}</td><td>${brl(r.cost)}</td><td>${brl(r.q*r.cost)}</td><td>${esc(r.who)}</td></tr>`).join("")||'<tr><td colspan="6">Nenhuma compra registrada.</td></tr>'}</table></div>`;
}
function vSale(){
  return `<div class="box"><h2>Registrar venda (saída de estoque)</h2>
  <form class="g" data-form="sale"><label>Produto<select name="pid" id="pp" required>${opts()}</select></label>
  <label>Quantidade<input type="number" min="1" name="q" value="1" required></label>
  <label>Preço unitário (R$)<input type="number" step="0.01" min="0" name="v" id="pc" required></label>
  <label>Cliente<input name="who"></label><div><button class="pri">Registrar venda</button></div></form></div>
  <div class="box tw"><h2>Últimas vendas</h2><table><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Preço un.</th><th>Total</th><th>Cliente</th></tr>
  ${DB.sales.slice().reverse().slice(0,100).map(r=>`<tr><td>${dt(r.at)}</td><td>${esc(pname(r.pid))}</td><td>${r.q}</td><td>${brl(r.price)}</td><td>${brl(r.q*r.price)}</td><td>${esc(r.who)}</td></tr>`).join("")||'<tr><td colspan="6">Nenhuma venda registrada.</td></tr>'}</table></div>`;
}
function vSum(){
  const rev=DB.sales.reduce((s,r)=>s+r.q*r.price,0),buy=DB.purchases.reduce((s,r)=>s+r.q*r.cost,0),
    stk=DB.products.reduce((s,p)=>s+p.s*p.cost,0),cnt=DB.sales.reduce((s,r)=>s+r.q,0),low=DB.products.filter(p=>p.s<=3);
  return `<div class="stats">
   <div class="box stat">Receita (vendas)<b>${brl(rev)}</b></div><div class="box stat">Gasto em compras<b>${brl(buy)}</b></div>
   <div class="box stat">Saldo (receita − compras)<b>${brl(rev-buy)}</b></div><div class="box stat">Itens vendidos<b>${cnt}</b></div>
   <div class="box stat">Valor do estoque (custo)<b>${brl(stk)}</b></div></div>
  <div class="box"><h2>Estoque baixo (3 ou menos)</h2>${low.length?low.map(p=>`<div>${esc(p.n)} — <span class="low">${p.s} un.</span></div>`).join(""):'<p class="note">Nenhum produto com estoque baixo.</p>'}</div>
  <div class="box"><h2>Dados</h2><p class="note" style="margin-bottom:12px">Os dados ficam no Firebase (Firestore) e os arquivos dos jogos no Vercel Blob. Exporte um backup de vez em quando.</p>
   <button data-export>Exportar backup (.json)</button> <button data-import>Importar backup</button> <button class="dan" data-reset>Restaurar exemplos</button></div>`;
}
function vKeys(){return`<div class="box"><h2>Adicionar chaves (entrega automática)</h2><div class="g">
  <label>Jogo<select id="kp">${DB.products.map(p=>`<option value="${p.id}">${esc(p.n)} (${p.k.length})</option>`).join("")}</select></label>
  <label class="wide">Chaves (uma por linha)<textarea id="kt" rows="6"></textarea></label><div><button class="pri" data-kadd>Adicionar chaves</button></div></div></div>
  <div class="box tw"><h2>Chaves livres</h2><table><tr><th>Jogo</th><th>Livres</th><th></th></tr>${DB.products.map(p=>`<tr><td>${esc(p.n)}</td><td class="${p.k.length<=3?"low":""}">${p.k.length}</td><td><button data-kclear="${p.id}">Limpar</button></td></tr>`).join("")}</table></div>`}
function vOrd(){return`<div class="box"><h2>Configuração da entrega</h2><div class="g">
  <label>Modo<select id="cm"><option value="pix" ${DB.cfg.mode!=="manual"?"selected":""}>Mercado Pago: QR Code Pix automático, entrega quando pagar</option><option value="manual" ${DB.cfg.mode==="manual"?"selected":""}>Manual: entrego após confirmar o pagamento</option></select></label>
  <label>Chave Pix (só no modo manual)<input id="cx" value="${esc(DB.cfg.pix)}"></label><div><button class="pri" data-csave>Salvar</button></div></div>
  <p class="note" style="margin-top:10px">${IPOK?"✅ Token do Mercado Pago configurado no servidor.":"⚠ O token do Mercado Pago não está no arquivo .env do servidor."}</p></div>
  <div class="box tw"><h2>Pedidos <button data-reload style="margin-left:8px;padding:5px 12px;font-size:.8rem">Atualizar</button></h2><table><tr><th>Cód.</th><th>Data</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Status</th><th></th></tr>${DB.orders.map(o=>`<tr><td>${esc(o.code)}</td><td>${dt(o.at)}</td><td>${o.name?esc(o.name)+"<br>":""}<span class="note">${esc(o.email)}</span></td><td>${brl(o.total)}</td><td>${o.capture?esc(o.capture==="pix"?"Pix":o.capture==="credit_card"?"Cartão":o.capture):o.paidManual?"Manual":o.mode==="teste"?"Teste":"—"}</td><td>${{entregue:"✅ Entregue",pendente:"⏳ Aguardando",sem_chaves:"⚠ Pago, sem arquivo",expirado:"✖ Pix expirado"}[o.status]||esc(o.status)}</td><td>${o.status!=="entregue"?`<button data-deliver="${o.code}">Confirmar pagamento e entregar</button>`:""}</td></tr>`).join("")||'<tr><td colspan="7">Sem pedidos.</td></tr>'}</table></div>`}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  try{
  if("kadd" in d){const pid=+$("#kp").value,raw=$("#kt").value;
    const n=await commit(()=>{const p=DB.products.find(x=>x.id===pid),have=new Set(p.k);
      const ls=[...new Set(raw.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&x.length<=300))].filter(x=>!have.has(x));
      p.k.push(...ls);p.s+=ls.length;return ls.length});
    toast(n?n+" chave(s) adicionada(s)":"Nenhuma chave nova.");render()}
  else if(d.kclear){if(confirm("Apagar todas as chaves livres deste jogo?")){await commit(()=>{const p=DB.products.find(x=>x.id==d.kclear);p.s=Math.max(0,p.s-p.k.length);p.k=[]});render()}}
  else if("csave" in d){const mode=$("#cm").value,pix=$("#cx").value.trim();await commit(()=>{DB.cfg.mode=mode;DB.cfg.pix=pix});toast("Salvo.");render()}
  else if(d.deliver){if(!confirm("O pagamento realmente caiu?"))return;const j=await api("/api/admin/deliver/"+d.deliver,{method:"POST"});await load();toast(j.status==="entregue"?"Pedido entregue.":"Sem arquivo ou chaves para entregar. Cadastre no produto.");render()}
  else if("reload" in d){await load();render()}
  }catch(err){toast(err.message)}
});
function vCli(){return`<div class="box tw"><h2>Clientes (contas do Firebase) <button data-reload style="margin-left:8px;padding:5px 12px;font-size:.8rem">Atualizar</button></h2><div id="cli"><p class="note">Carregando…</p></div></div>`}
async function loadCli(){
  const el=$("#cli");if(!el)return;
  try{const j=await api("/api/admin/clientes");if(!$("#cli"))return;
    $("#cli").innerHTML=`<p class="note" style="margin-bottom:8px">${j.clientes.length} conta(s) cadastrada(s).</p><table><tr><th>Nome</th><th>E-mail</th><th>Criada em</th><th>Último acesso</th><th>Compras</th><th>Total gasto</th></tr>`+
      (j.clientes.map(c=>`<tr><td>${esc(c.nome||"—")}${c.desativado?' <span class="low">(desativada)</span>':""}</td><td>${esc(c.email)}</td><td>${c.criado?dt(c.criado):"—"}</td><td>${c.ultimo?dt(c.ultimo):"—"}</td><td>${c.compras}</td><td>${brl(c.gasto)}</td></tr>`).join("")||'<tr><td colspan="6">Nenhuma conta ainda.</td></tr>')+`</table>`}
  catch(e){if($("#cli"))$("#cli").innerHTML=`<p class="note" style="color:var(--bad)">${esc(e.message)}</p>`}
}
function render(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tab===tab)));
  $("#view").innerHTML={produtos:vProd,chaves:vKeys,pedidos:vOrd,clientes:vCli,compras:vBuy,vendas:vSale,resumo:vSum}[tab]();
  if(tab==="clientes")loadCli();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tab){tab=d.tab;editId=0;draft=[];dfile=null;render();load().then(render).catch(()=>{})}
  else if(d.edit){editId=+d.edit;const ep=DB.products.find(p=>p.id===editId)||{};draft=[...(ep.f||[])];dfile=ep.fid?{fid:ep.fid,fn:ep.fn,fz:ep.fz}:null;render();scrollTo({top:0,behavior:"smooth"})}
  else if("cancel" in d){editId=0;draft=[];dfile=null;render()}
  else if("addfile" in d)$("#pfile").click();
  else if("rmfile" in d){dfile=null;render()}
  else if("addphoto" in d){if(draft.length>=6)return toast("Máximo de 6 fotos.");$("#pimg").click()}
  else if("addurl" in d){
    const u=$("#purl").value.trim();
    if(!/^(https?:\/\/|data:image\/)/i.test(u))return toast("Cole um link que comece com https://");
    if(draft.length>=6)return toast("Máximo de 6 fotos.");
    draft.push(u);$("#purl").value="";drawPh();
  }
  else if(d.prem!==undefined){draft.splice(+d.prem,1);drawPh()}
  else if(d.pcover!==undefined){const [x]=draft.splice(+d.pcover,1);draft.unshift(x);drawPh()}
  else if(d.del){
    const id=+d.del;if(!confirm("Excluir este produto?"))return;
    commit(()=>{if(DB.sales.some(r=>r.pid===id)||DB.purchases.some(r=>r.pid===id)||DB.orders.some(o=>o.items.some(i=>i.id===id))){DB.products.find(p=>p.id===id).a=false;return"Tem movimentações: foi apenas ocultado da loja."}
      DB.products=DB.products.filter(p=>p.id!==id);return"Produto excluído."}).then(m=>{toast(m);render()},err=>toast(err.message));
  }
  else if("export" in d){
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}));
    a.download="loja-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href);
  }
  else if("import" in d)$("#imp").click();
  else if("reset" in d){if(confirm("Apagar TUDO (produtos, pedidos e vendas) e voltar aos produtos de exemplo?")){commit(()=>{const c=DB.cfg;DB=norm(seed());DB.cfg=c}).then(()=>{render();toast("Dados restaurados.")},err=>toast(err.message))}}
});
$("#pfile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const el=$("#fileinfo");if(el)el.innerHTML='<span class="note">Salvando arquivo…</span>';
  try{
    if(BLOB){ /* envia direto para o Vercel Blob: sem limite de 4,5 MB */
      const {upload}=await import(window.BLOB_CLIENT||"https://esm.sh/@vercel/blob/client");
      const b=await upload("jogos/"+f.name.replace(/[^\w.\-]+/g,"_"),f,{access:"public",handleUploadUrl:"/api/blob",clientPayload:pass(),multipart:f.size>25e6,
        onUploadProgress:p=>{const x=$("#fileinfo");if(x&&p&&p.percentage!=null)x.innerHTML=`<span class="note">Enviando… ${Math.round(p.percentage)}%</span>`}});
      dfile={fid:b.url,fn:f.name,fz:f.size};
    }else{const j=await api("/api/admin/upload",{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:f});dfile={fid:j.fid,fn:f.name,fz:j.fz}}
    if(tab==="produtos"){/* preserva o que já foi digitado no formulário */const fm=$('[data-form="prod"]'),vals=fm?Object.fromEntries(new FormData(fm)):null;render();
      if(vals){const nf=$('[data-form="prod"]');for(const k in vals){const i=nf.elements[k];if(i&&i.type!=="checkbox")i.value=vals[k]}nf.elements.a.checked=!!vals.a}}
    toast("Arquivo pronto. Clique em Salvar produto.")}
  catch(err){toast("Não consegui enviar o arquivo: "+err.message);if(el)el.innerHTML=fileInfo()}
});
$("#pimg").addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";let skipped=0;
  for(const f of files){
    if(draft.length>=6){skipped++;continue}
    try{const j=await api("/api/admin/foto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:await compress(f)})});draft.push(j.url)}catch(err){toast("Não consegui enviar a imagem "+f.name+": "+err.message)}
  }
  drawPh();if(skipped)toast("Máximo de 6 fotos por produto.");
});
$("#imp").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  let d;try{d=JSON.parse(await f.text());if(!Array.isArray(d.products))throw 0}catch(err){e.target.value="";return toast("Arquivo de backup inválido.")}
  if(!confirm("Substituir todos os dados da loja por este backup?")){e.target.value="";return}
  try{
    let n=0;for(const p of d.products){if(!Array.isArray(p.f))continue;for(let i=0;i<p.f.length;i++)if(/^data:image\//.test(p.f[i])){toast("Enviando fotos do backup… "+(++n));const j=await api("/api/admin/foto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:p.f[i]})});p.f[i]=j.url}}
    await commit(()=>{const c=DB.cfg;DB=norm(d);DB.cfg=c});render();toast("Backup importado. (Os pedidos do backup não são importados.)")}catch(err){toast(err.message)}
  e.target.value="";
});
document.addEventListener("change",e=>{
  if(e.target.id!=="pp")return;const o=e.target.selectedOptions[0],pc=$("#pc");
  if(o&&o.value&&pc)pc.value=tab==="vendas"?o.dataset.price:o.dataset.cost;
});
document.addEventListener("submit",async e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  if(f==="login"){sessionStorage.setItem("dn_admin",d.pw);return start()}
  const btn=e.target.querySelector("button.pri");if(btn)btn.disabled=true;
  try{
    const msg=await commit(()=>{
    if(f==="prod"){
      const n=d.n.trim();if(!n)throw new Error("Informe o nome do produto.");
      const o={n,d:d.d.trim(),p:Math.max(0,+d.p||0),cost:Math.max(0,+d.cost||0),s:Math.max(0,parseInt(d.s)||0),u:(d.u||"").trim(),c:d.c.trim()||"Geral",c1:d.c1,c2:d.c2,a:!!d.a,dl:(d.dl||"").trim(),f:draft.slice(),fid:dfile?dfile.fid:"",fn:dfile?dfile.fn:"",fz:dfile?dfile.fz:0};
      if(editId){const ep=DB.products.find(p=>p.id===editId);if(!ep)throw new Error("Produto não existe mais.");Object.assign(ep,o);return"Produto atualizado."}
      DB.products.push({id:nextId(DB.products),...o});return"Produto adicionado."
    }else{
      const pid=+d.pid,q=parseInt(d.q),v=+d.v,p=DB.products.find(x=>x.id===pid);
      if(!p||q<1||!(v>=0))throw new Error("Preencha produto, quantidade e valor.");
      const at=new Date().toISOString();
      if(f==="buy"){p.s+=q;p.cost=v;DB.purchases.push({id:nextId(DB.purchases),pid,q,cost:v,who:d.who.trim(),at});return"Compra registrada e estoque atualizado."}
      else{if(p.s<q)throw new Error("Estoque insuficiente para essa venda.");p.s-=q;DB.sales.push({id:nextId(DB.sales),pid,q,price:v,who:d.who.trim(),at});return"Venda registrada e estoque atualizado."}
    }});
    if(f==="prod"){editId=0;draft=[];dfile=null}
    toast(msg);render();
  }catch(err){toast(err.message);if(btn)btn.disabled=false}
});
start();
</script>
</body>
</html>
